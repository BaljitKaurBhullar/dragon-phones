<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">

<body data-category="laptops" class="bg-zinc-950 text-zinc-100 antialiased selection:bg-red-500 selection:text-white">

            </a>
            <nav aria-label="Main navigation" class="flex flex-wrap items-center gap-x-6 gap-y-3 text-sm font-medium text-zinc-300">
